# Byte-compilation, checkdoc and the offline ERT suite, on every push to
# main and every pull request.  Flycheck, which the checker in
# lsp-ltex-plus-flycheck.el is written against, is fetched at its latest
# release so those tests run rather than skip.
#
# The live tests run in a job of their own, against the latest released
# `ltex-ls-plus' (bundled JDK included).  The release tag is the cache
# key, so the 300 MB tarball is downloaded once per new release and a
# server that changes under the client shows up here rather than in a
# user's report.  The job is a gate like the others: a red run after a
# server release means the client has something to adapt to.
#
# The matrix is the declared floor (29.1), then the newest of each
# series, then master.  The floor was tried lower once lsp-mode no longer
# set it: Emacs 27 has no `project-root', and Emacs 28 has neither the
# four-argument `define-key' nor a flymake that replaces a backend's
# earlier report when a later one names a region -- and that last one
# would not fail a build, only leave stale underlines behind.  Both ends have already
# earned their place: ERT arms `debug-on-error' around every test up to
# 29 and not after, and `checkdoc' turns its experimental verb check off
# by default from 31 -- each of which failed a run that the other
# versions passed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '29.4', '30.2', '31.1', 'snapshot']
    name: Emacs ${{ matrix.emacs_version }}
    # A snapshot Emacs breaks for reasons that are not this package's;
    # it is here as early warning, not as a gate.
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      # Flycheck is not part of Emacs, and the tests of the flycheck
      # checker skip without it.  The latest release is what is cloned, so
      # a flycheck that changes under the checker shows up here rather
      # than in a user's report -- the same bargain as the live job.
      - name: Fetch flycheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/flycheck/flycheck/releases/latest --jq .tag_name)
          git clone --quiet --depth 1 --branch "${tag}" \
            https://github.com/flycheck/flycheck.git "${RUNNER_TEMP}/flycheck"
          echo "LTEX_PLUS_FLYCHECK_DIR=${RUNNER_TEMP}/flycheck" >> "$GITHUB_ENV"
          echo "flycheck ${tag}"

      - name: Report version
        run: emacs --version | head -1

      - run: make check

  live:
    runs-on: ubuntu-latest
    name: Live against the latest ltex-ls-plus
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '29.1'

      # The latest release's tag, which keys the cache below.  Resolved
      # every run so a new release invalidates the cache on its own.
      - name: Find the latest ltex-ls-plus release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/ltex-plus/ltex-ls-plus/releases/latest --jq .tag_name)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Latest ltex-ls-plus release: ${tag}"

      - name: Restore the cached server
        id: cache
        uses: actions/cache@v4
        with:
          path: ltex-ls-plus
          key: ltex-ls-plus-${{ steps.release.outputs.tag }}-linux-x64-layout2

      - name: Download the server
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo ltex-plus/ltex-ls-plus \
            --pattern 'ltex-ls-plus-*-linux-x64.tar.gz' \
            --output server.tar.gz
          mkdir ltex-ls-plus
          # Entries are "./ltex-ls-plus-X.Y.Z/bin/...": two components to drop.
          tar xzf server.tar.gz -C ltex-ls-plus --strip-components=2
          rm server.tar.gz

      # The launcher script picks its Java from JAVA_HOME; point it at the
      # JDK the release bundles rather than whatever the runner ships.
      - name: Put the server on PATH
        run: |
          test -x ltex-ls-plus/bin/ltex-ls-plus || { ls -R ltex-ls-plus | head -20; exit 1; }
          echo "${PWD}/ltex-ls-plus/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$(ls -d "${PWD}"/ltex-ls-plus/jdk-*)" >> "$GITHUB_ENV"

      - name: Report versions
        run: |
          emacs --version | head -1
          ltex-ls-plus --version

      - run: make test-live
